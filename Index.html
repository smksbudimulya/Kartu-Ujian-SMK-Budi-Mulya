<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>EduFlow — SMKS Budi Mulya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#4f46e5;--pl:#eef2ff;--s:#0f766e;--bg:#f6f7fb;--card:#fff;--tx:#172033;--muted:#64748b;--border:#e2e8f0;--ok:#059669;--warn:#d97706;--danger:#dc2626;--shadow:0 8px 24px rgba(15,23,42,.07);--r:14px}
*{box-sizing:border-box}body{margin:0;font-family:"Plus Jakarta Sans",sans-serif;background:var(--bg);color:var(--tx)}button,input,select,textarea{font:inherit}.app{display:none;min-height:100vh}.sidebar{position:fixed;left:0;top:0;bottom:0;width:255px;background:#fff;border-right:1px solid var(--border);z-index:20;overflow:auto}.brand{padding:20px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--border)}.brand-icon{width:38px;height:38px;border-radius:11px;background:var(--p);color:white;display:grid;place-items:center;font-weight:800}.brand b{font-size:17px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.menu{padding:14px}.group{font-size:10px;text-transform:uppercase;color:#94a3b8;font-weight:800;margin:15px 9px 6px}.item{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:10px;color:#475569;cursor:pointer;font-size:12px;font-weight:700;margin:2px 0}.item:hover,.item.active{background:var(--pl);color:var(--p)}.main{margin-left:255px;min-height:100vh}.top{height:64px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:10}.crumb{font-weight:800}.user{font-size:12px;text-align:right}.user small{display:block;color:var(--muted)}.content{padding:24px}.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.stat,.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}.stat{padding:16px}.stat small{color:var(--muted);font-weight:700}.stat strong{display:block;font-size:27px;margin-top:7px}.card{padding:18px;margin-bottom:18px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.title{font-size:16px;font-weight:800}.sub{font-size:11px;color:var(--muted);margin-top:3px}.btn{border:0;border-radius:9px;padding:9px 13px;cursor:pointer;font-weight:800;font-size:11px}.primary{background:var(--p);color:white}.secondary{background:#f1f5f9;color:#334155}.danger{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:9px 8px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}th{background:#f8fafc;color:#64748b;font-size:10px;text-transform:uppercase}.badge{display:inline-block;padding:4px 7px;border-radius:99px;font-size:9px;font-weight:800;background:#f1f5f9}.normal{background:#dcfce7;color:#166534}.sedang{background:#fef3c7;color:#92400e}.tinggi{background:#fee2e2;color:#991b1b}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:10px;font-weight:800;color:#64748b;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:9px;padding:9px 10px;outline:none;background:#fff}.field textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap}.login{min-height:100vh;display:grid;grid-template-columns:1fr 420px}.loginLeft{background:linear-gradient(135deg,#4338ca,#6366f1);color:white;padding:55px;display:flex;flex-direction:column;justify-content:center}.loginLeft h1{font-size:40px;line-height:1.1}.loginRight{display:flex;align-items:center;padding:35px;background:white}.loginBox{width:100%}.loginBox input{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;margin:7px 0 14px}.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:100;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modalBox{background:#fff;width:min(850px,100%);max-height:90vh;overflow:auto;border-radius:16px;padding:20px}.toast{position:fixed;right:18px;bottom:18px;background:#172033;color:white;padding:11px 14px;border-radius:10px;z-index:200;font-size:11px}.mobile{display:none}.empty{text-align:center;color:#94a3b8;padding:30px}.click{cursor:pointer}.notice{padding:11px;background:#f8fafc;border-radius:10px;margin:7px 0}.progress{height:7px;background:#e2e8f0;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--p)}@media(max-width:1000px){.sidebar{left:-255px}.sidebar.open{left:0}.main{margin-left:0}.mobile{display:block}.grid5{grid-template-columns:repeat(2,1fr)}.grid4{grid-template-columns:repeat(2,1fr)}.login{grid-template-columns:1fr}.loginLeft{display:none}}@media(max-width:600px){.content{padding:14px}.grid5,.grid4,.grid2,.formgrid{grid-template-columns:1fr}.top{padding:0 14px}.brand{padding:16px}}
</style>
</head>
<body>
<div id="login" class="login">
  <section class="loginLeft"><div><div style="font-weight:800;font-size:20px">EduFlow</div><h1>Monitoring Perkembangan Siswa</h1><p>SMKS Budi Mulya — akademik, presensi, pembinaan, laporan, dan komunikasi sekolah dengan orang tua.</p></div></section>
  <section class="loginRight"><div class="loginBox">
    <h2>Selamat Datang 👋</h2><p style="color:#64748b;font-size:12px">Masuk ke portal EduFlow</p>
    <label style="font-size:11px;font-weight:800">Username</label><input id="username" autocomplete="username" placeholder="Username">
    <label style="font-size:11px;font-weight:800">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password">
    <button class="btn primary" style="width:100%;padding:12px" onclick="login()">Masuk</button>
    <p id="loginMsg" style="color:#dc2626;font-size:11px"></p>
  </div></section>
</div>

<div id="app" class="app">
<aside id="sidebar" class="sidebar">
  <div class="brand"><div class="brand-icon">E</div><div><b>EduFlow</b><small>SMKS Budi Mulya</small></div></div>
  <nav id="menu" class="menu"></nav>
</aside>
<main class="main">
  <header class="top"><div><button class="btn secondary mobile" onclick="toggleSide()">☰</button> <span id="crumb" class="crumb">Dashboard</span></div><div class="user"><b id="userName"></b><small id="userRole"></small></div></header>
  <section id="content" class="content"></section>
</main>
</div>
<div id="modal" class="modal"><div class="modalBox"><div class="head"><div id="modalTitle" class="title"></div><button class="btn secondary" onclick="closeModal()">Tutup</button></div><div id="modalBody"></div></div></div>
<div id="toast"></div>

<script>
const state={token:sessionStorage.getItem('eduflow_token')||'',user:null,settings:{},lookup:{},dashboard:null,current:'dashboard'};
const roleMenus={
 ADMIN:[
  ['OVERVIEW','dashboard','Dashboard'],['','pengumuman','Pengumuman'],
  ['DATA MASTER','siswa','Data Siswa'],['','master_guru','Data Guru'],['','import','Import Template'],
  ['AKADEMIK','kehadiran','Presensi Siswa'],['','jurnal_mengajar','Jurnal Mengajar'],['','tugas','Ketuntasan Tugas'],['','buku_nilai','Buku Nilai'],
  ['WALI & BIMBINGAN','jurnal_wali','Jurnal Guru Wali'],['','ews','Early Warning System'],
  ['JADWAL & AGENDA','jadwal','Jadwal Mengajar'],['','jam','Jam Pelajaran'],['','kalender','Kalender Akademik'],
  ['LAPORAN & SISTEM','laporan','Cetak Laporan'],['','aktivitas','Riwayat Aktivitas'],['','pengaturan','Pengaturan Sekolah']
 ],
 KEPSEK:[
  ['OVERVIEW','dashboard','Dashboard Monitoring'],['','pengumuman','Pengumuman'],['MONITORING','siswa','Data Siswa'],['','ews','Early Warning System'],['','laporan','Laporan'],['','aktivitas','Riwayat Aktivitas']
 ],
 GURU:[
  ['OVERVIEW','dashboard','Dashboard'],['','pengumuman','Pengumuman'],['AKADEMIK','siswa','Siswa yang Diajar'],['','kehadiran','Presensi Siswa'],['','jurnal_mengajar','Jurnal Mengajar'],['','tugas','Ketuntasan Tugas'],['','buku_nilai','Buku Nilai'],['LAPORAN','laporan','Ekspor Laporan']
 ],
 WALI_KELAS:[
  ['OVERVIEW','dashboard','Dashboard'],['','siswa','Siswa Kelas'],['AKADEMIK','kehadiran','Presensi Siswa'],['','jurnal_mengajar','Jurnal Mengajar'],['','tugas','Ketuntasan Tugas'],['','buku_nilai','Buku Nilai'],['WALI & BIMBINGAN','jurnal_wali','Jurnal Guru Wali'],['','ews','Early Warning System'],['LAPORAN','laporan','Ekspor Laporan']
 ],
 GURU_WALI:[
  ['OVERVIEW','dashboard','Dashboard'],['','siswa','Siswa Binaan'],['AKADEMIK','kehadiran','Presensi Siswa'],['','jurnal_mengajar','Jurnal Mengajar'],['','tugas','Ketuntasan Tugas'],['','buku_nilai','Buku Nilai'],['WALI & BIMBINGAN','jurnal_wali','Jurnal Guru Wali'],['','ews','Early Warning System'],['LAPORAN','laporan','Ekspor Laporan']
 ],
 ORANG_TUA:[
  ['OVERVIEW','dashboard','Dashboard Anak'],['','pengumuman','Pengumuman'],['PERKEMBANGAN','siswa','Data & Perkembangan Anak'],['','kehadiran','Kehadiran Anak'],['','buku_nilai','Nilai Anak'],['','tugas','Ketuntasan Tugas'],['','ews','Kondisi & Catatan Guru Wali'],['LAPORAN','laporan','Laporan Anak']
 ]
};

function gas(fn,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(e))[fn](...args))}
async function login(){
  const u=document.getElementById('username').value,p=document.getElementById('password').value;
  document.getElementById('loginMsg').textContent='Memeriksa akun...';
  try{const r=await gas('loginUser',u,p);if(!r.success)throw Error(r.message);state.token=r.token;state.user=r.user;sessionStorage.setItem('eduflow_token',r.token);await boot()}catch(e){document.getElementById('loginMsg').textContent=e.message}}
async function boot(){
  try{const b=await gas('getBootstrap',state.token);state.user=b.user;state.settings=b.settings;state.lookup=b.lookup;state.dashboard=b.dashboard;document.getElementById('login').style.display='none';document.getElementById('app').style.display='flex';document.getElementById('userName').textContent=state.user.nama_lengkap;document.getElementById('userRole').textContent=state.user.role;renderMenu();navigate('dashboard')}catch(e){sessionStorage.removeItem('eduflow_token');state.token='';document.getElementById('login').style.display='grid';document.getElementById('loginMsg').textContent=e.message}}
function renderMenu(){const m=roleMenus[state.user.role]||[];document.getElementById('menu').innerHTML=m.map(x=>(x[0]?`<div class="group">${x[0]}</div>`:'')+`<div class="item" data-v="${x[1]}" onclick="navigate('${x[1]}')">▸ ${x[2]}</div>`).join('')}
function navigate(v){state.current=v;document.querySelectorAll('.item').forEach(x=>x.classList.toggle('active',x.dataset.v===v));document.getElementById('crumb').textContent=v.replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());if(innerWidth<1000)document.getElementById('sidebar').classList.remove('open');({dashboard:renderDashboard,pengumuman:renderAnnouncements,siswa:renderStudents,master_guru:renderTeachers,import:renderImport,kehadiran:renderAttendance,jurnal_mengajar:renderTeachingJournal,tugas:renderTasks,buku_nilai:renderGradebook,jurnal_wali:renderHomeroom,ews:renderEws,jadwal:renderSchedule,jam:renderPeriods,kalender:renderCalendar,laporan:renderReports,aktivitas:renderActivity,pengaturan:renderSettings}[v]||renderDashboard)()}
function toggleSide(){document.getElementById('sidebar').classList.toggle('open')}
function toast(s){const t=document.getElementById('toast');t.innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>t.innerHTML='',2800)}
function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function options(arr,idField,nameField,selected=''){return arr.map(x=>`<option value="${esc(x[idField])}" ${String(x[idField])===String(selected)?'selected':''}>${esc(x[nameField])}</option>`).join('')}
function cls(id){return state.lookup.kelas?.find(x=>String(x.kelas_id)===String(id))?.nama_kelas||''}
function mapel(id){return state.lookup.mapel?.find(x=>String(x.mapel_id)===String(id))?.nama_mapel||''}
function badge(level){return `<span class="badge ${String(level).toLowerCase()}">${esc(level)}</span>`}
function base(title,sub,actions=''){return `<div class="card"><div class="head"><div><div class="title">${title}</div><div class="sub">${sub||''}</div></div><div class="actions">${actions}</div></div>`}

async function renderDashboard(){
  try{state.dashboard=await gas('getDashboard',state.token)}catch(e){toast(e.message);return}
  const d=state.dashboard,c=d.cards||{},school=state.settings.school_name||'SMKS Budi Mulya';
  let cards=d.mode==='school'?`
    <div class="grid5">${[['🏫','Jumlah Kelas',c.jumlahKelas],['👥','Jumlah Siswa',c.jumlahSiswa],['✓','Kelas Sudah Absen',c.kelasSudahAbsen],['⌛','Kelas Belum Absen',c.kelasBelumAbsen],['👨‍🏫','Total Guru',c.totalGuru]].map(x=>`<div class="stat"><small>${x[0]} ${x[1]}</small><strong>${x[2]??0}</strong></div>`).join('')}</div>`:
    `<div class="grid4">${Object.entries(c).map(([k,v])=>`<div class="stat"><small>${k.replaceAll('_',' ')}</small><strong>${v??0}</strong></div>`).join('')}</div>`;
  document.getElementById('content').innerHTML=`<div style="margin-bottom:18px"><h2 style="margin:0">${esc(state.user.nama_lengkap)} 👋</h2><div class="sub">${school} · ${esc(state.user.role)}</div></div>${cards}
  <div class="grid2" style="margin-top:18px">${base('⚠️ Early Warning System','Ringkasan siswa yang perlu diperhatikan')}${(d.ews||[]).length?`<div class="tablewrap"><table><thead><tr><th>Siswa</th><th>Risiko</th><th>Indikator</th></tr></thead><tbody>${d.ews.map(e=>`<tr><td><b>${esc(e.nama_lengkap)}</b></td><td>${badge(e.level_sistem)}</td><td>${esc((e.indikator||[]).join(', '))}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Tidak ada siswa yang terdeteksi berisiko.</div>`}</div>
  ${base('📢 Pengumuman Terbaru','Informasi sekolah')}${(d.announcements||[]).map(a=>`<div class="notice"><b>${esc(a.judul)}</b><div class="sub">${esc(a.isi)}</div></div>`).join('')||'<div class="empty">Belum ada pengumuman.</div>'}</div></div>`;
}
async function renderStudents(){
  document.getElementById('content').innerHTML=base('Data Siswa','Daftar siswa sesuai kewenangan akun',state.user.role==='ADMIN'?'<button class="btn primary" onclick="studentForm()">+ Tambah Siswa</button>':'')+`<div id="studentTable">Memuat...</div></div>`;
  try{const r=await gas('getStudents',state.token,{});document.getElementById('studentTable').innerHTML=`<div class="tablewrap"><table><thead><tr><th>NIS</th><th>NISN</th><th>Nama</th><th>Kelas</th><th>JK</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${r.data.map(s=>`<tr><td>${esc(s.nis)}</td><td>${esc(s.nisn)}</td><td><b>${esc(s.nama_lengkap)}</b></td><td>${esc(cls(s.kelas_id))}</td><td>${esc(s.jenis_kelamin)}</td><td>${esc(s.status_siswa)}</td><td><button class="btn secondary" onclick="studentDetail('${s.siswa_id}')">Detail</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Tidak ada data.</td></tr>'}</tbody></table></div>`}catch(e){toast(e.message)}}
async function studentDetail(id){try{const r=await gas('getStudentDetail',state.token,id);const s=r.student,e=r.ews;openModal('Detail Siswa',`<div class="grid2"><div><b>${esc(s.nama_lengkap)}</b><div class="sub">NIS ${esc(s.nis)} · NISN ${esc(s.nisn)}</div><p>Kelas: ${esc(cls(s.kelas_id))}</p><p>TTL: ${esc(s.tempat_lahir)}, ${esc(s.tanggal_lahir)}</p><p>Alamat: ${esc(s.alamat)}</p><p>HP: ${esc(s.no_hp)}</p></div><div><b>Kondisi Saat Ini</b><p>${badge(e?.level_sistem||'NORMAL')}</p><p>Kehadiran: ${e?.kehadiran_pct??100}%</p><p>Rata-rata nilai: ${e?.rata_nilai??'-'}</p><p>Tugas tuntas: ${e?.ketuntasan_tugas_pct??100}%</p>${r.journals?.length?`<b>Catatan Guru Wali</b>${r.journals.slice(0,5).map(j=>`<div class="notice">${esc(j.ringkasan)}<div class="sub">${esc(j.saran_orang_tua)}</div></div>`).join('')}`:''}</div></div>`)}catch(e){toast(e.message)}}
function studentForm(){openModal('Tambah Siswa','<div class="notice">Untuk input banyak siswa, gunakan menu <b>Import Template</b>. Form ini untuk satu siswa.</div><div class="formgrid">'+field('nis','NIS')+field('nisn','NISN')+field('nama_lengkap','Nama Lengkap')+field('nama_panggilan','Nama Panggilan')+field('jenis_kelamin','Jenis Kelamin','select','Laki-laki|Perempuan')+field('tempat_lahir','Tempat Lahir')+field('tanggal_lahir','Tanggal Lahir','date')+field('nik','NIK')+field('agama','Agama')+field('alamat','Alamat')+`<div class="field"><label>Kelas</label><select id="kelas_id">${options(state.lookup.kelas,'kelas_id','nama_kelas')}</select></div>`+`</div><br><button class="btn primary" onclick="saveOneStudent()">Simpan</button>`)}
function field(id,label,type='text',opts=''){return `<div class="field"><label>${label}</label>${type==='select'?`<select id="${id}">${opts.split('|').map(o=>`<option>${o}</option>`).join('')}</select>`:`<input id="${id}" type="${type}">`}</div>`}
async function saveOneStudent(){const d={siswa_id:'',nis:v('nis'),nisn:v('nisn'),nama_lengkap:v('nama_lengkap'),nama_panggilan:v('nama_panggilan'),jenis_kelamin:v('jenis_kelamin'),tempat_lahir:v('tempat_lahir'),tanggal_lahir:v('tanggal_lahir'),nik:v('nik'),agama:v('agama'),alamat:v('alamat'),kelas_id:v('kelas_id'),tahun_ajaran_id:state.settings.active_academic_year,status_siswa:'AKTIF'};try{await gas('adminUpdateStudent',state.token,d);toast('Tersimpan');closeModal();renderStudents()}catch(e){toast(e.message)}}
async function renderTeachers(){document.getElementById('content').innerHTML=base('Data Guru','Master guru dikelola Admin',`<button class="btn primary" onclick="teacherForm()">+ Tambah Guru</button>`)+`<div id="teacherTable">Memuat...</div></div>`;try{const r=await gas('getLookupData',state.token,state.settings.active_academic_year);document.getElementById('teacherTable').innerHTML=`<div class="tablewrap"><table><thead><tr><th>NIP</th><th>Nama</th><th>Mapel Utama</th><th>HP</th><th>Status</th></tr></thead><tbody>${r.guru.map(g=>`<tr><td>${esc(g.nip)}</td><td><b>${esc(g.nama_lengkap)}</b></td><td>${esc(g.mapel_utama)}</td><td>${esc(g.no_hp)}</td><td>${esc(g.status)}</td></tr>`).join('')}</tbody></table></div>`}catch(e){toast(e.message)}}
function teacherForm(){openModal('Tambah Guru','<div class="formgrid">'+field('nip','NIP')+field('nik','NIK')+field('nama_lengkap','Nama Lengkap')+field('gelar','Gelar')+field('jenis_kelamin','Jenis Kelamin','select','Laki-laki|Perempuan')+field('no_hp','No HP')+field('email','Email')+field('alamat','Alamat')+field('mapel_utama','Mapel Utama')+'</div><br><button class="btn primary" onclick="saveTeacher()">Simpan</button>')}
async function saveTeacher(){const d={nip:v('nip'),nik:v('nik'),nama_lengkap:v('nama_lengkap'),gelar:v('gelar'),jenis_kelamin:v('jenis_kelamin'),no_hp:v('no_hp'),email:v('email'),alamat:v('alamat'),mapel_utama:v('mapel_utama')};try{await gas('adminSaveGuru',state.token,d);toast('Guru disimpan');closeModal();renderTeachers()}catch(e){toast(e.message)}}
async function renderImport(){document.getElementById('content').innerHTML=base('Import Data dengan Template','Admin menggunakan template untuk input banyak Guru, Siswa, dan assignment Guru Wali')+`<div class="grid2">${['GURU','SISWA','GURU_WALI_SISWA'].map(t=>`<div class="card" style="box-shadow:none"><div class="title">${t}</div><div class="sub">Download template CSV, isi sesuai kolom, lalu upload.</div><br><button class="btn secondary" onclick="downloadTemplate('${t}')">Download Template</button><input type="file" accept=".csv,text/csv" onchange="uploadCsv('${t}',this)" style="margin-top:10px;width:100%"></div>`).join('')}</div></div>`}
async function downloadTemplate(type){try{const r=await gas('getImportTemplate',state.token,type);const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(r.csv);a.download='EduFlow_Template_'+type+'.csv';a.click()}catch(e){toast(e.message)}}
async function uploadCsv(type,input){const f=input.files[0];if(!f)return;const text=await f.text();try{const r=await gas('importCsv',state.token,type,text);toast(`Import selesai: ${r.imported}/${r.total}`);if(r.errors.length)openModal('Hasil Import',`<p>Berhasil: <b>${r.imported}</b> dari ${r.total}</p>${r.errors.map(x=>`<div class="notice">Baris ${x.row}: ${esc(x.message)}</div>`).join('')}`)}catch(e){toast(e.message)}}
async function renderAttendance(){const r=await gas('getStudents',state.token,{});const rows=r.data;document.getElementById('content').innerHTML=base('Presensi Siswa','Input massal: pilih tanggal lalu tandai status siswa',`<button class="btn primary" onclick="saveAttendanceUI()">Simpan Semua</button>`)+`<div class="formgrid">${field('att_date','Tanggal','date')}<div class="field"><label>Jam Pelajaran</label><select id="att_jam">${options(state.lookup.jamPelajaran,'jam_id','jam_ke')}</select></div></div><br><div class="tablewrap"><table><thead><tr><th>NIS</th><th>Nama</th><th>Kelas</th><th>Status</th><th>Keterangan</th></tr></thead><tbody>${rows.map(s=>`<tr><td>${esc(s.nis)}</td><td><b>${esc(s.nama_lengkap)}</b></td><td>${esc(cls(s.kelas_id))}</td><td><select class="att" data-id="${s.siswa_id}"><option>H</option><option>S</option><option>I</option><option>A</option></select></td><td><input class="attk" data-id="${s.siswa_id}" placeholder="opsional"></td></tr>`).join('')}</tbody></table></div></div>`;document.getElementById('att_date').value=new Date().toISOString().slice(0,10)}
async function saveAttendanceUI(){const date=v('att_date'),jam=v('att_jam');const rows=[...document.querySelectorAll('.att')].map(x=>({siswa_id:x.dataset.id,status:x.value,tanggal:date,jam_pelajaran:jam}));try{const r=await gas('saveAttendance',state.token,{rows:rows});toast(`${r.saved} presensi disimpan`)}catch(e){toast(e.message)}}
async function renderGradebook(){const r=await gas('getGradebook',state.token,{});document.getElementById('content').innerHTML=base('Buku Nilai','Nama siswa otomatis dari database. Guru hanya mengisi nilai.',`<button class="btn primary" onclick="gradeForm()">+ Input Nilai</button>`)+`<div class="tablewrap"><table><thead><tr><th>NIS</th><th>Nama</th><th>Kelas</th><th>Rata-rata</th><th>Level</th></tr></thead><tbody>${r.data.map(x=>`<tr><td>${esc(x.nis)}</td><td><b>${esc(x.nama_lengkap)}</b></td><td>${esc(cls(x.kelas_id))}</td><td>${x.nilai_rata_rata}</td><td>${badge(x.level||'-')}</td></tr>`).join('')}</tbody></table></div></div>`}
async function gradeForm(){const r=await gas('getStudents',state.token,{});openModal('Input Nilai Massal','<div class="formgrid"><div class="field"><label>Mapel</label><select id="g_mapel">'+options(state.lookup.mapel,'mapel_id','nama_mapel')+'</select></div>'+field('g_nama','Nama Penilaian')+field('g_tanggal','Tanggal','date')+field('g_jenis','Jenis','select','TUGAS|UH/KUIS|UTS|UAS')+'</div><br><div class="tablewrap"><table><thead><tr><th>Siswa</th><th>Nilai 0-100</th></tr></thead><tbody>'+r.data.map(s=>`<tr><td>${esc(s.nama_lengkap)}<input type="hidden" class="gid" value="${s.siswa_id}"></td><td><input class="gval" data-id="${s.siswa_id}" type="number" min="0" max="100"></td></tr>`).join('')+'</tbody></table></div><br><button class="btn primary" onclick="saveGradesUI()">Simpan Semua Nilai</button>');document.getElementById('g_tanggal').value=new Date().toISOString().slice(0,10)}
async function saveGradesUI(){const rows=[...document.querySelectorAll('.gval')].filter(x=>x.value!=='').map(x=>({siswa_id:x.dataset.id,nilai:Number(x.value),mapel_id:v('g_mapel'),nama_penilaian:v('g_nama'),jenis_penilaian:v('g_jenis'),tanggal:v('g_tanggal')}));try{const r=await gas('saveGrades',state.token,{rows:rows});toast(`${r.saved} nilai disimpan`);closeModal();renderGradebook()}catch(e){toast(e.message)}}
async function renderEws(){const r=await gas('getEws',state.token);document.getElementById('content').innerHTML=base('Early Warning System','Deteksi otomatis berdasarkan presensi, nilai, tugas, dan pelanggaran')+`<div class="tablewrap"><table><thead><tr><th>Siswa</th><th>Risiko</th><th>Presensi</th><th>Nilai</th><th>Tugas</th><th>Indikator</th><th>Aksi</th></tr></thead><tbody>${r.data.map(e=>`<tr><td><b>${esc(e.nama_lengkap)}</b></td><td>${badge(e.level_sistem)}</td><td>${e.kehadiran_pct}%</td><td>${e.rata_nilai}</td><td>${e.ketuntasan_tugas_pct}%</td><td>${esc(e.indikator.join(', '))}</td><td>${state.user.role!=='GURU'&&state.user.role!=='ORANG_TUA'?`<button class="btn secondary" onclick="ewsForm('${e.siswa_id}')">Review</button>`:''}</td></tr>`).join('')}</tbody></table></div></div>`}
async function ewsForm(id){const r=await gas('getStudentDetail',state.token,id),e=r.ews||{};openModal('Review EWS — '+r.student.nama_lengkap,`<div class="notice">${esc((e.indikator||[]).join(', '))}</div>${field('ews_cat','Catatan Guru Wali')} ${field('ews_saran','Saran untuk Orang Tua')}<div class="field"><label>Status Pembinaan</label><select id="ews_status"><option>NORMAL</option><option>DALAM_PEMANTAUAN</option><option>SELESAI</option></select></div><label style="font-size:11px"><input id="ews_pub" type="checkbox"> Terbitkan kepada Orang Tua</label><br><br><button class="btn primary" onclick="saveEws('${id}')">Simpan & Publikasikan</button>`)}
async function saveEws(id){try{await gas('saveEwsReview',state.token,{siswa_id:id,catatan_guru_wali:v('ews_cat'),saran_orang_tua:v('ews_saran'),status_pembinaan:v('ews_status'),publish_orang_tua:document.getElementById('ews_pub').checked});toast('EWS diperbarui');closeModal();renderEws()}catch(e){toast(e.message)}}
async function renderHomeroom(){const r=await gas('getStudents',state.token,{});document.getElementById('content').innerHTML=base('Jurnal Guru Wali','Catatan pembinaan, saran, dan tindak lanjut',`<button class="btn primary" onclick="journalForm()">+ Catat Pembinaan</button>`)+`<div class="tablewrap"><table><thead><tr><th>Siswa</th><th>Kelas</th><th>Info</th></tr></thead><tbody>${r.data.map(s=>`<tr><td><b>${esc(s.nama_lengkap)}</b></td><td>${esc(cls(s.kelas_id))}</td><td><button class="btn secondary" onclick="journalForm('${s.siswa_id}')">Catat</button></td></tr>`).join('')}</tbody></table></div></div>`}
function journalForm(id=''){openModal('Catatan Guru Wali',`<div class="formgrid"><div class="field"><label>Siswa</label><select id="jw_siswa">${options(window._students||[], 'siswa_id','nama_lengkap',id)}</select></div>${field('jw_kategori','Kategori','select','Akademik|Kehadiran|Kedisiplinan|Konseling|Prestasi|Lainnya')}</div>${field('jw_ringkasan','Ringkasan')} ${field('jw_tindak','Tindak Lanjut')} ${field('jw_saran','Saran untuk Orang Tua')}<label style="font-size:11px"><input id="jw_pub" type="checkbox"> Tampilkan kepada Orang Tua</label><br><br><button class="btn primary" onclick="saveJournal()">Simpan</button>`);gas('getStudents',state.token,{}).then(r=>{window._students=r.data;document.getElementById('jw_siswa').innerHTML=options(r.data,'siswa_id','nama_lengkap',id)})}
async function saveJournal(){try{await gas('saveHomeroomJournal',state.token,{siswa_id:v('jw_siswa'),kategori:v('jw_kategori'),ringkasan:v('jw_ringkasan'),tindak_lanjut:v('jw_tindak'),saran_orang_tua:v('jw_saran'),status:'AKTIF',publish_orang_tua:document.getElementById('jw_pub').checked?'YA':'TIDAK',tanggal:new Date().toISOString().slice(0,10)});toast('Catatan tersimpan');closeModal()}catch(e){toast(e.message)}}
async function renderTeachingJournal(){document.getElementById('content').innerHTML=base('Jurnal Mengajar','Catat pelaksanaan pembelajaran',`<button class="btn primary" onclick="teachingForm()">+ Tambah Jurnal</button>`)+`<div class="empty">Jurnal mengajar tersimpan di database dan dapat diekspor melalui Laporan.</div></div>`}
function teachingForm(){openModal('Tambah Jurnal Mengajar','<div class="formgrid"><div class="field"><label>Kelas</label><select id="jm_kelas">'+options(state.lookup.kelas,'kelas_id','nama_kelas')+'</select></div><div class="field"><label>Mapel</label><select id="jm_mapel">'+options(state.lookup.mapel,'mapel_id','nama_mapel')+'</select></div>'+field('jm_tgl','Tanggal','date')+field('jm_jp','Jam Pelajaran')+field('jm_hadir','Jumlah Hadir','number')+field('jm_sakit','Sakit','number')+field('jm_izin','Izin','number')+field('jm_alpa','Alpa','number')+'</div>'+field('jm_materi','Materi')+field('jm_kendala','Kendala')+field('jm_tindak','Tindak Lanjut')+'<br><button class="btn primary" onclick="saveTeaching()">Simpan</button>');document.getElementById('jm_tgl').value=new Date().toISOString().slice(0,10)}
async function saveTeaching(){try{await gas('saveTeachingJournal',state.token,{kelas_id:v('jm_kelas'),mapel_id:v('jm_mapel'),tanggal:v('jm_tgl'),jam_pelajaran:v('jm_jp'),materi:v('jm_materi'),jumlah_hadir:v('jm_hadir'),jumlah_sakit:v('jm_sakit'),jumlah_izin:v('jm_izin'),jumlah_alpa:v('jm_alpa'),kendala:v('jm_kendala'),tindak_lanjut:v('jm_tindak')});toast('Jurnal tersimpan');closeModal()}catch(e){toast(e.message)}}
async function renderTasks(){document.getElementById('content').innerHTML=base('Ketuntasan Tugas','Monitoring status tugas siswa')+`<div class="empty">Input tugas dapat dikembangkan menjadi tabel massal seperti Buku Nilai. Data tetap menggunakan siswa_id dari database.</div></div>`}
async function renderSchedule(){document.getElementById('content').innerHTML=base('Jadwal Mengajar','Jadwal sesuai data penugasan')+`<div class="empty">Gunakan sheet JADWAL untuk data jadwal. Modul tampilan siap disambungkan ke API jadwal.</div></div>`}
async function renderPeriods(){document.getElementById('content').innerHTML=base('Jam Pelajaran','Struktur waktu sekolah')+`<div class="tablewrap"><table><thead><tr><th>Jam</th><th>Mulai</th><th>Selesai</th><th>Keterangan</th></tr></thead><tbody>${state.lookup.jamPelajaran.map(x=>`<tr><td>${esc(x.jam_ke)}</td><td>${esc(x.waktu_mulai)}</td><td>${esc(x.waktu_selesai)}</td><td>${esc(x.keterangan)}</td></tr>`).join('')}</tbody></table></div></div>`}
async function renderCalendar(){document.getElementById('content').innerHTML=base('Kalender Akademik','Agenda sekolah')+`<div class="empty">Data kalender dikelola melalui sheet KALENDER.</div></div>`}
async function renderAnnouncements(){const r=await gas('getAnnouncements',state.token);document.getElementById('content').innerHTML=base('Pengumuman','Informasi sesuai target role',state.user.role==='ADMIN'||state.user.role==='KEPSEK'||state.user.role==='GURU'?'<button class="btn primary" onclick="announcementForm()">+ Buat</button>':'')+(r.data||[]).map(a=>`<div class="notice"><b>${esc(a.judul)}</b><div class="sub">${esc(a.isi)}</div></div>`).join('')||'<div class="empty">Belum ada pengumuman.</div></div>'}
function announcementForm(){openModal('Buat Pengumuman',field('an_judul','Judul')+field('an_isi','Isi')+'<br><button class="btn primary" onclick="saveAnnouncement()">Terbitkan</button>')}
async function saveAnnouncement(){try{await gas('saveAnnouncement',state.token,{judul:v('an_judul'),isi:v('an_isi'),target_role:'ALL'});toast('Pengumuman diterbitkan');closeModal();renderAnnouncements()}catch(e){toast(e.message)}}
async function renderReports(){document.getElementById('content').innerHTML=base('Cetak / Ekspor Laporan','Guru hanya dapat mengekspor siswa yang menjadi kewenangannya')+`<div class="formgrid"><div class="field"><label>Jenis Laporan</label><select id="rp_type"><option>PERKEMBANGAN_SISWA</option><option>PRESENSI</option><option>NILAI</option><option>KETUNTASAN_TUGAS</option></select></div><div class="field"><label>Siswa (opsional)</label><select id="rp_siswa"><option value="">Semua dalam kewenangan</option></select></div>${field('rp_start','Tanggal Mulai','date')}${field('rp_end','Tanggal Akhir','date')}<div class="field"><label>Orientasi</label><select id="rp_ori"><option value="portrait">Portrait</option><option value="landscape">Landscape</option></select></div></div><br><button class="btn primary" onclick="generateReportUI()">Generate PDF</button></div>`;const r=await gas('getStudents',state.token,{});document.getElementById('rp_siswa').innerHTML='<option value="">Semua dalam kewenangan</option>'+options(r.data,'siswa_id','nama_lengkap');document.getElementById('rp_start').value=new Date(new Date().getFullYear(),new Date().getMonth(),1).toISOString().slice(0,10);document.getElementById('rp_end').value=new Date().toISOString().slice(0,10)}
async function generateReportUI(){try{const r=await gas('generateReport',state.token,{jenis_laporan:v('rp_type'),siswa_id:v('rp_siswa'),tanggal_mulai:v('rp_start'),tanggal_selesai:v('rp_end'),orientasi:v('rp_ori')});openModal('PDF Berhasil Dibuat',`<p>File: <b>${esc(r.name)}</b></p><a class="btn primary" target="_blank" href="${esc(r.url)}">Buka / Cetak PDF</a>`)}catch(e){toast(e.message)}}
async function renderActivity(){const r=await gas('getActivityLogs',state.token,100);document.getElementById('content').innerHTML=base('Riwayat Aktivitas','Audit trail sistem')+`<div class="tablewrap"><table><thead><tr><th>Waktu</th><th>Role</th><th>Aksi</th><th>Modul</th><th>Detail</th></tr></thead><tbody>${r.data.map(x=>`<tr><td>${esc(x.waktu)}</td><td>${esc(x.role)}</td><td>${esc(x.aksi)}</td><td>${esc(x.modul)}</td><td>${esc(x.detail)}</td></tr>`).join('')}</tbody></table></div></div>`}
async function renderSettings(){const s=state.settings;document.getElementById('content').innerHTML=base('Pengaturan Sekolah','Hanya Admin yang dapat mengubah identitas sekolah')+`<div class="formgrid">${field('sc_name','Nama Sekolah')+field('sc_npsn','NPSN')+field('sc_nss','NSS')+field('sc_phone','Telepon')+field('sc_email','Email')+field('sc_web','Website')+field('sc_principal','Kepala Sekolah')+field('sc_nip','NIP Kepala Sekolah')+field('sc_address','Alamat')+field('sc_village','Desa/Kelurahan')+field('sc_district','Kecamatan')+field('sc_regency','Kabupaten')+field('sc_province','Provinsi')+field('sc_postal','Kode Pos')+field('sc_logo','URL Logo')+field('sc_ta','Tahun Ajaran Aktif')+field('sc_sem','Semester','select','Ganjil|Genap')}</div><br><button class="btn primary" onclick="saveSettings()">Simpan Pengaturan</button></div>`;[['sc_name','school_name'],['sc_npsn','school_npsn'],['sc_nss','school_nss'],['sc_phone','school_phone'],['sc_email','school_email'],['sc_web','school_website'],['sc_principal','principal_name'],['sc_nip','principal_nip'],['sc_address','school_address'],['sc_village','school_village'],['sc_district','school_district'],['sc_regency','school_regency'],['sc_province','school_province'],['sc_postal','school_postal_code'],['sc_logo','school_logo_url'],['sc_ta','active_academic_year'],['sc_sem','active_semester']].forEach(([a,b])=>{const e=document.getElementById(a);if(e)e.value=s[b]||''})}
async function saveSettings(){const d={school_name:v('sc_name'),school_npsn:v('sc_npsn'),school_nss:v('sc_nss'),school_phone:v('sc_phone'),school_email:v('sc_email'),school_website:v('sc_web'),principal_name:v('sc_principal'),principal_nip:v('sc_nip'),school_address:v('sc_address'),school_village:v('sc_village'),school_district:v('sc_district'),school_regency:v('sc_regency'),school_province:v('sc_province'),school_postal_code:v('sc_postal'),school_logo_url:v('sc_logo'),active_academic_year:v('sc_ta'),active_semester:v('sc_sem')};try{const r=await gas('saveSchoolSettings',state.token,d);state.settings=r.settings;toast('Pengaturan tersimpan')}catch(e){toast(e.message)}}
async function renderBukuNilaiView(){} // alias compatibility
function v(id){return document.getElementById(id)?.value||''}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.activeElement?.id==='password')login()})
if(state.token)boot();
</script>
